<!DOCTYPE HTML>
<html lang="pt-BR">
	<head>
		<title>JK Universitário | Novo Endereço Oficial</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="canonical" href="https://www.jkuniversitario.com.br/" />
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			body {
				font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
				background-color: #f4f7f6;
				color: #333;
				display: flex;
				justify-content: center;
				align-items: center;
				min-height: 100vh;
				padding: 20px;
			}
			.card {
				background: #ffffff;
				padding: 40px 30px;
				border-radius: 12px;
				box-shadow: 0 8px 24px rgba(0,0,0,0.1);
				max-width: 500px;
				width: 100%;
				text-align: center;
			}
			.icon {
				font-size: 50px;
				margin-bottom: 15px;
			}
			h1 {
				color: #111;
				font-size: 24px;
				margin-bottom: 15px;
			}
			p {
				font-size: 16px;
				line-height: 1.6;
				color: #555;
				margin-bottom: 25px;
			}
			.btn {
				display: inline-block;
				background-color: #25D366;
				color: #ffffff;
				padding: 14px 28px;
				font-size: 16px;
				font-weight: bold;
				text-decoration: none;
				border-radius: 8px;
				transition: background-color 0.2s ease, transform 0.2s ease;
			}
			.btn:hover {
				background-color: #1ebd59;
				transform: translateY(-2px);
			}
			.url-text {
				margin-top: 20px;
				font-size: 14px;
				color: #888;
			}
		</style>
	</head>
	<body>

		<div class="card">
			<div class="icon">🏠✨</div>
			<h1>Mudamos de Endereço!</h1>
			<p>O site do <strong>JK Universitário</strong> está de cara nova e com domínio oficial próprio.</p>
			
			<a href="https://www.jkuniversitario.com.br" class="btn">
				Acessar www.jkuniversitario.com.br
			</a>

			<p class="url-text">Clique no botão acima para ser direcionado ao novo site oficial.</p>
		</div>

	</body>
</html>
